# DinoLink: DINOv2 token extraction + selection + VQ
# Model & selection (dinov2_name: base | large | giant)
# dinov2_name can be changed to facebook/dinov2-with-registers-base for cleaner attention (fewer artifacts)
# dinov2_image_size: 224 -> 256 patches; 448 -> 1024 patches (uses more GPU memory)
# top_k: number of selected tokens. latent grid is automatically = patch grid (image_size/14)^2
#   256px -> ~18x18=324 patches; 448px -> 32x32=1024 patches
#   when top_k < total number of patches, selected positions get a VQ token and the rest are filled with 0
model:
  dinov2_name: "facebook/dinov2-with-registers-base"
  dinov2_image_size: 448
  # top_k: 912  # effectively "all tokens" (clamped to current patch count)
  top_k: 1024 
  selection: "attention"

# Quantizer
# z_dim: VQ bottleneck dimension. The closer to hidden_size(768), the less information loss, but the lower the compression ratio
# codebook_size: larger means stronger expressive power, but utilization may be low
quantizer:
  type: "rvq"    # "vq" | "rvq"
  # type: "none"    # "vq" | "rvq"
  # codebook_size: 768
  codebook_size: 768
  z_dim: 128
  num_quantizers: 2  # only for rvq

# Decoder: TokenDecoder
# Each VQ token is decoded directly back into the DINO token space (hidden_size)
decoder:
  type: "token"
  hidden_dim: 768               # MLP hidden layer dimension of the token decoder
  use_pos: true                 # concatenate (row, col) positional prior to the decoder input

# Data (local CAM_FRONT directory)
# image_size: only truly high resolution when it matches model.dinov2_image_size
# image_size: null -> original image is fed in, prone to GPU OOM (ViT attention O(N^2)); 224 is safe, 448 needs more GPU memory
data:
  dataset: "nuscenes"   # "nuscenes" | "waymo" | "coco" (fallback)
  # data_root: "/mnt/datasets/nuScenes/sweeps/CAM_FRONT/"
  data_root: "/mnt/datasets/nuScenes/"
  # data_root: "/home/tianle/dinolink_project/v1.0-mini"
  test_data_root: null  # optional: separate root for test (default: data_root)
  multi_view: false     # true: load 6 cameras (FRONT/FRONT_LEFT/FRONT_RIGHT/BACK/BACK_LEFT/BACK_RIGHT)
  image_size: 448      # no resize in DinoLink extractor; token grid follows input resolution
  batch_size: 4     
  num_workers: 4    

# Training / run

# token_weight: weight of the token reconstruction loss, default 1.0
run:
  epochs: 30
  lr: 2.0e-4
  beta: 0.3
  codebook_lr: 2.0e-3
  codebook_momentum: 0.5
  # Token reconstruction loss switched to Logit-Laplace NLL.
  token_l2_weight: 1.0
  token_logit_laplace_weight: 0.1
  logit_laplace_scale: 1.0
  logit_laplace_eps: 1.0e-6
  # VQ only: periodic K-means refresh for codebook (0 = disable)
  codebook_kmeans_every: 400
  codebook_kmeans_iters: 15
  codebook_kmeans_samples: 8192   # 0=use all current-step z_enc, >0=random subsample
  token_weight: 1.0
  save_visuals: false    # false: do not save attention/selection/token-matrix figures
  log_dir: "logs"
  save_every: 5      
  seed: 42
